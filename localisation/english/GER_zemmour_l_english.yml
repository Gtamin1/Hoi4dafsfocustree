l_english:

 ##########################################
 # FOCUS NAMES & DESCRIPTIONS — RECONQUETE expansion
 ##########################################

 GER_zem_print_the_manifesto:0 "Print the Manifesto"
 GER_zem_print_the_manifesto_desc:0 "Zemmour's supporters transform tavern applause into printed doctrine. The first RECONQUETE manifesto mixes national renewal, mockery of stale slogans, bureaucratic discipline, and a promise that Germany will be governed by argument rather than tantrum."

 GER_zem_barroom_network:0 "The Barroom Network"
 GER_zem_barroom_network_desc:0 "From Munich beer halls to smoky Berlin taverns, local organisers turn informal debate circles into a national political machine. Every table becomes a miniature campaign office, and the regime's informers no longer know which conversations to take seriously."

 GER_zem_mockery_as_weapon:0 "Mockery as a Weapon"
 GER_zem_mockery_as_weapon_desc:0 "The movement learns that ridicule can puncture a cult faster than pamphlets. Speeches, jokes, posters, and caricatures transform Hitler from untouchable symbol into a punchline, and once a man is laughed at he can no longer be feared."

 GER_zem_organize_student_cells:0 "Organize Student Cells"
 GER_zem_organize_student_cells_desc:0 "Universities become recruitment grounds for the new movement. Debating societies, lecture circles, and student newspapers carry RECONQUETE slogans across the country, and a generation discovers that politics need not be a screaming match."

 GER_zem_union_of_speakers:0 "Union of Speakers"
 GER_zem_union_of_speakers_desc:0 "RECONQUETE trains speakers who can face hecklers, win crowds, and redirect anger away from fascist theatrics. The party becomes known for disciplined public argument rather than empty volume."

 GER_zem_newspapers_against_hysteria:0 "Newspapers Against Hysteria"
 GER_zem_newspapers_against_hysteria_desc:0 "Friendly editors receive interviews, columns, and cartoons. Newspapers begin presenting fascist hysteria as embarrassing political theatre rather than destiny, and the regime's mythology starts to look like a third-rate stage play."

 GER_zem_radio_argument_hour:0 "The Radio Argument Hour"
 GER_zem_radio_argument_hour_desc:0 "Radio makes the tavern speech national. Zemmour's voice, sharpened into weekly addresses, reaches factories, farms, and army barracks, and listeners discover that political argument can sound like literature instead of barking."

 GER_zem_tailors_of_the_new_suit:0 "Tailors of the New Suit"
 GER_zem_tailors_of_the_new_suit_desc:0 "The movement adopts a deliberately sober image: dark suits, clean documents, and a refusal to drown politics in theatrical uniforms. Aesthetic discipline becomes a political statement."

 GER_zem_reconquete_youth_leagues:0 "RECONQUETE Youth Leagues"
 GER_zem_reconquete_youth_leagues_desc:0 "Youth leagues form around debate, physical training, civil discipline, and loud contempt for stale extremism. The regime watches them nervously and discovers that nothing terrifies a cult more than an organised eighteen-year-old with footnotes."

 GER_zem_rally_in_berlin:0 "Rally in Berlin"
 GER_zem_rally_in_berlin_desc:0 "A massive rally in Berlin proves the movement is no longer a tavern joke. Crowds chant for political renewal and laugh at the old regime's attempts to dismiss them, and the international press takes notes."

 GER_zem_the_slogan_machine:0 "The Slogan Machine"
 GER_zem_the_slogan_machine_desc:0 "A special committee turns every fascist cliche into a counter-slogan. Germany discovers that propaganda can be both disciplined and extremely petty, and the new posters spread faster than the old ones could be torn down."

 GER_zem_local_chapters:0 "Local Chapters"
 GER_zem_local_chapters_desc:0 "The movement organises at the district level. Local chapters coordinate meetings, canvassing, pamphlet delivery, and rapid responses to fascist intimidation, turning enthusiasm into infrastructure."

 GER_zem_membership_books:0 "Membership Books"
 GER_zem_membership_books_desc:0 "RECONQUETE replaces loose enthusiasm with membership ledgers, dues, committees, and accountability. The meme movement becomes an institution, complete with a treasurer who is never amused."

 GER_zem_the_bar_becomes_a_party:0 "The Bar Becomes a Party"
 GER_zem_the_bar_becomes_a_party_desc:0 "The original tavern becomes a mythic headquarters. What began as a speech over beer now claims to be the founding moment of a German political rebirth, and the regional chapters all repeat the same origin story with regional embellishments."

 GER_zem_expose_the_screamers:0 "Expose the Screamers"
 GER_zem_expose_the_screamers_desc:0 "RECONQUETE publishes compilations of fascist contradictions, failed promises, and theatrical excess. Hitler's loyalists rage, which only proves the point — and every banned booklet is reprinted twice over by the next morning."

 GER_zem_debate_the_brownshirts:0 "Debate the Brownshirts"
 GER_zem_debate_the_brownshirts_desc:0 "Instead of meeting street muscle with street muscle, Zemmour demands public debates. The brownshirts discover that slogans fare poorly under cross-examination, and the audience learns that intimidation can be answered with footnotes."

 GER_zem_split_the_old_party:0 "Split the Old Party"
 GER_zem_split_the_old_party_desc:0 "Moderates, opportunists, and embarrassed officials are offered a ladder down from Hitler's cult. The old party begins to crack under its own absurdity, and entire wings discreetly walk into RECONQUETE meetings carrying their own paperwork."

 GER_zem_parliament_of_insults:0 "Parliament of Insults"
 GER_zem_parliament_of_insults_desc:0 "A chaotic parliamentary session becomes legendary when RECONQUETE deputies answer every threat with surgical mockery. The transcripts sell out by morning, and the speaker is forced to invent new procedural rules in real time."

 GER_zem_vote_of_no_confidence:0 "Vote of No Confidence"
 GER_zem_vote_of_no_confidence_desc:0 "RECONQUETE forces a formal confrontation with the government. What was whispered in taverns is now recorded in state procedure, and the regime can no longer pretend that the movement is a fringe annoyance."

 GER_zem_the_empty_podium_trick:0 "The Empty Podium Trick"
 GER_zem_the_empty_podium_trick_desc:0 "When Hitler refuses a debate, RECONQUETE stages an empty podium beside Zemmour and lets the silence argue for itself. The image circulates faster than any rebuttal could have."

 GER_zem_investigate_party_finances:0 "Investigate Party Finances"
 GER_zem_investigate_party_finances_desc:0 "Accountants and hostile journalists follow the money. The regime's moral posturing looks less impressive beside ledgers and receipts, and several minor scandals queue up for their day in court."

 GER_zem_the_moustache_question:0 "The Moustache Question"
 GER_zem_the_moustache_question_desc:0 "A ridiculous pamphlet asks why a nation should be governed by facial hair and fury. The regime bans it, ensuring that everyone reads it and that the joke spreads to every workshop in the country."

 GER_zem_public_order_without_thugs:0 "Public Order Without Thugs"
 GER_zem_public_order_without_thugs_desc:0 "RECONQUETE promises that order does not require party thugs. Local officials tired of street chaos quietly begin cooperating, and uniformed politics begins to lose its automatic prestige."

 GER_zem_the_trial_of_theatrics:0 "The Trial of Theatrics"
 GER_zem_the_trial_of_theatrics_desc:0 "A public inquiry turns the regime's performance style into evidence of political unseriousness. The hearings are devastating, quotable, and impossible to ignore, and the regime's defenders sound increasingly like nervous understudies."

 GER_zem_isolate_hitler_loyalists:0 "Isolate Hitler Loyalists"
 GER_zem_isolate_hitler_loyalists_desc:0 "RECONQUETE separates hard loyalists from opportunists, then isolates the hardliners in public. The old machine loses its aura of inevitability, and even sympathisers begin to keep a polite distance from anyone still shouting from rooftops."

 GER_zem_secure_the_chancellery:0 "Secure the Chancellery"
 GER_zem_secure_the_chancellery_desc:0 "The political crisis reaches the Chancellery. Through procedure, pressure, coalition bargains, and public momentum, Zemmour enters government as Germany's new political centre. The doors are not kicked in; they are unlocked by accountants."

 GER_zem_cabinet_of_reconquest:0 "Cabinet of RECONQUETE"
 GER_zem_cabinet_of_reconquest_desc:0 "The new cabinet is assembled from loyal organisers, conservative administrators, technocrats, and professional mockers of the old regime. Every department gets a desk, a brief, and a strict instruction not to scream."

 GER_zem_ministry_of_argument:0 "Ministry of Argument"
 GER_zem_ministry_of_argument_desc:0 "The new government institutionalises debate training, public rebuttal, and ideological education. Every ministry gets talking points and footnotes, and ministers are reminded that any public statement may be quoted in court."

 GER_zem_reform_the_civil_service:0 "Reform the Civil Service"
 GER_zem_reform_the_civil_service_desc:0 "Civil servants are told that the era of theatrical commands is over. Paperwork, competence, and procedure become political virtues again, and the more dramatic appointees of the previous regime quietly disappear into provincial archives."

 GER_zem_reconquete_constitutional_act:0 "RECONQUETE Constitutional Act"
 GER_zem_reconquete_constitutional_act_desc:0 "A constitutional act formalises the new political order without resorting to revolutionary chaos. The state is redirected through law, not street brawls, and the act is debated line by line on national radio."

 GER_zem_party_above_the_meme:0 "Party Above the Meme"
 GER_zem_party_above_the_meme_desc:0 "Zemmour warns supporters that a meme can win attention, but only institutions can govern. The movement begins acting like a state party, and the loudest jokers are gently reassigned to drafting committees."

 GER_zem_restore_public_confidence:0 "Restore Public Confidence"
 GER_zem_restore_public_confidence_desc:0 "The government lowers the temperature, ends the daily spectacle, and reassures citizens that politics need not be permanent crisis. The papers run boring headlines, and the country breathes for the first time in years."

 GER_zem_clean_government_campaign:0 "Clean Government Campaign"
 GER_zem_clean_government_campaign_desc:0 "The new regime targets graft, party favours, and propaganda slush funds. Nothing humiliates the old order like an audit, and entire fortunes evaporate under the cold eye of a balance sheet."

 GER_zem_appoint_the_orators:0 "Appoint the Orators"
 GER_zem_appoint_the_orators_desc:0 "Veteran speakers of the barroom era are given official roles. Their job is to explain policy before rumours can explain it first, and they discover that ministerial briefings make for excellent material."

 GER_zem_national_reconciliation_committees:0 "National Reconciliation Committees"
 GER_zem_national_reconciliation_committees_desc:0 "Local committees draw former opponents into public hearings and municipal compromise. Germany exhales, though not quietly, and the worst extremists find that their old supporters now prefer practical neighbours to ideological brothers."

 GER_zem_the_serious_man_doctrine:0 "The Serious Man Doctrine"
 GER_zem_the_serious_man_doctrine_desc:0 "Government propaganda reframes Zemmour as the serious man who defeated the screamers. The joke becomes a doctrine of disciplined rule, and ministerial briefings begin opening with quotations from the founding tavern speech."

 GER_zem_court_the_conservatives:0 "Court the Conservatives"
 GER_zem_court_the_conservatives_desc:0 "Old conservatives dislike Hitler's chaos and distrust Zemmour's meme army. They can still be convinced that he is the safer bet, particularly once a few of them are offered nicely framed cabinet portraits."

 GER_zem_pact_with_industrialists:0 "Pact with Industrialists"
 GER_zem_pact_with_industrialists_desc:0 "Industrialists are promised predictability, anti-chaos politics, and no endless revolutionary theatre. Their money and newspapers begin to shift, and the movement gains sources that have never knocked a beer table over in their lives."

 GER_zem_churchill_not_called:0 "Churchill Is Not Called"
 GER_zem_churchill_not_called_desc:0 "A confused aide suggests asking Britain for advice. Zemmour rejects it, declaring Germany can make its own political comedy and that the British are notorious for stealing punchlines."

 GER_zem_reassure_the_army:0 "Reassure the Army"
 GER_zem_reassure_the_army_desc:0 "The officer corps is promised order, budgets, and fewer humiliating speeches from amateurs. They listen carefully, and several grim generals are observed nodding very slightly."

 GER_zem_the_sober_uniform_policy:0 "The Sober Uniform Policy"
 GER_zem_the_sober_uniform_policy_desc:0 "The government restricts party uniforms and theatrical street displays. Politics must return to offices, halls, ballots, and newspapers, and the country experiences a strange and welcome quiet on weekends."

 GER_zem_prussian_administrators:0 "Prussian Administrators"
 GER_zem_prussian_administrators_desc:0 "Experienced administrators are brought back into government. Their charisma is negligible; their file discipline is terrifying, and the trains begin running with insulting punctuality."

 GER_zem_monarchist_conversation:0 "The Monarchist Conversation"
 GER_zem_monarchist_conversation_desc:0 "Some conservatives request a symbolic restoration. Zemmour permits discussion, provided nobody interrupts the actual government, and the matter quietly returns to private dinner conversations where it does no harm."

 GER_zem_bureaucrats_over_brawlers:0 "Bureaucrats Over Brawlers"
 GER_zem_bureaucrats_over_brawlers_desc:0 "The state prefers boring administrators to street fighters. The old paramilitary aesthetic loses access to government corridors, and the corridors themselves are repainted in a shade specifically chosen to discourage shouting."

 GER_zem_the_grand_compromise:0 "The Grand Compromise"
 GER_zem_the_grand_compromise_desc:0 "Conservatives, Zemmourists, technocrats, and anti-Hitler defectors sign a governing compromise. It is ugly, effective, and very German, and the document is countersigned by men who would never share a tavern table in private."

 GER_zem_radical_plebiscite:0 "Radical Plebiscite"
 GER_zem_radical_plebiscite_desc:0 "Instead of elite compromise, Zemmour turns to the voters. A national plebiscite will decide whether Germany wants a Zemmourist future, and the movement bets its credibility on a single nationwide ballot."

 GER_zem_campaign_trains:0 "Campaign Trains"
 GER_zem_campaign_trains_desc:0 "Trains carry speakers, posters, and portable microphones across Germany. The movement becomes a rolling argument, and rural stations that have never seen a national politician suddenly receive three a week."

 GER_zem_ballots_not_brownshirts:0 "Ballots Not Brownshirts"
 GER_zem_ballots_not_brownshirts_desc:0 "The referendum campaign presents a simple contrast: ballots and speeches against fists and shouting. Even sceptical citizens understand the choice, and the phrase becomes a slogan stencilled onto walls overnight."

 GER_zem_referendum_on_the_future:0 "Referendum on the Future"
 GER_zem_referendum_on_the_future_desc:0 "Germany votes on whether the new movement should govern. The result will determine whether Zemmour rules by mandate or coalition bargain, and the night of the count is broadcast across the country in a tense, almost reverent silence."

 GER_zem_constitutional_guardrails:0 "Constitutional Guardrails"
 GER_zem_constitutional_guardrails_desc:0 "The victorious movement writes limits into its own rise: procedure, fixed offices, and legal forms to prevent another cult from replacing the last. Legal scholars are quietly surprised to be invited into government."

 GER_zem_the_republic_of_rebuttals:0 "The Republic of Rebuttals"
 GER_zem_the_republic_of_rebuttals_desc:0 "Political legitimacy is redefined as the ability to survive rebuttal. Every minister is expected to defend policy in public, and the new constitution effectively turns the country into a permanent debate club with state powers."

 GER_zem_majority_of_mockery:0 "Majority of Mockery"
 GER_zem_majority_of_mockery_desc:0 "Satirical posters, debate victories, and exhausted voters combine into a majority coalition that laughs the old extremists offstage. The opposition retreats, muttering, into provincial committees that nobody listens to."

 GER_zem_legal_end_of_the_cult:0 "Legal End of the Cult"
 GER_zem_legal_end_of_the_cult_desc:0 "A legal process dismantles the cult's institutional privileges. The focus is not vengeance; it is making the spectacle ordinary, taxable, and beatable, and the courts move with deliberate boredom."

 GER_zem_european_conference_no_france_war:0 "European Conference"
 GER_zem_european_conference_no_france_war_desc:0 "Zemmour's Germany hosts a conference promising political confidence without reckless western adventures. France is addressed as a neighbour, not a target, and delegates leave with the unfamiliar sensation that Berlin has stopped shouting."

 GER_zem_trade_over_tantrums:0 "Trade Over Tantrums"
 GER_zem_trade_over_tantrums_desc:0 "The new government argues that serious states trade before they threaten. Economic committees replace shouting matches, and Germany's rail timetables become a more interesting export than its slogans."

 GER_zem_non_aggression_in_the_west:0 "Non-Aggression in the West"
 GER_zem_non_aggression_in_the_west_desc:0 "Germany publicly rejects immediate western war politics. The announcement shocks hardliners and reassures border communities, and several embassy bars in Paris and London report unusually relaxed evenings."

 GER_zem_central_european_dialogue:0 "Central European Dialogue"
 GER_zem_central_european_dialogue_desc:0 "Berlin opens talks with Central European governments about trade, railways, and anti-chaos diplomacy. The conversations are dull, technical, and quietly transformative."

 GER_zem_anti_communist_argument_not_crusade:0 "Anti-Communist Argument, Not Crusade"
 GER_zem_anti_communist_argument_not_crusade_desc:0 "The government opposes communism through speeches, unions, and elections rather than immediate reckless crusades. Pamphlets multiply; armies, mercifully, do not."

 GER_zem_secure_the_borders_without_adventures:0 "Secure the Borders Without Adventures"
 GER_zem_secure_the_borders_without_adventures_desc:0 "Security policy is reframed as defence, customs control, and border administration, not grandstanding conquest. Border guards are issued thicker manuals and warmer coats."

 GER_zem_diplomats_with_punchlines:0 "Diplomats With Punchlines"
 GER_zem_diplomats_with_punchlines_desc:0 "Germany's diplomats are instructed to be serious in policy and devastating in after-dinner remarks. It works more often than expected, and several major treaties are signed by counterparts who arrived determined to refuse."

 GER_zem_radio_to_the_world:0 "Radio to the World"
 GER_zem_radio_to_the_world_desc:0 "International broadcasts present the Zemmourist turn as Germany choosing argument over hysteria. Foreign capitals listen with caution, and several long-running newsroom prejudices are quietly revised."

 GER_zem_internal_security_review:0 "Internal Security Review"
 GER_zem_internal_security_review_desc:0 "The new government reviews police, courts, and local administrations to ensure extremist loyalists cannot sabotage the transition. Quiet reassignments do more work than any decree could."

 GER_zem_ban_private_armies:0 "Ban Private Armies"
 GER_zem_ban_private_armies_desc:0 "Paramilitary politics is declared incompatible with the new order. Germany will have one state, not competing uniforms, and the surplus armbands fill several state warehouses."

 GER_zem_civic_discipline_campaign:0 "Civic Discipline Campaign"
 GER_zem_civic_discipline_campaign_desc:0 "Citizens are urged to treat politics as civic duty rather than mass hysteria. Posters emphasise queues, punctuality, debate, and clean paperwork, and the country accepts the propaganda with a kind of ironic relief."

 GER_zem_restore_local_elections:0 "Restore Local Elections"
 GER_zem_restore_local_elections_desc:0 "Municipal elections return under strict public-order rules. RECONQUETE expects to win by making its opponents look ridiculous, and the early returns suggest the strategy is working."

 GER_zem_party_finance_law:0 "Party Finance Law"
 GER_zem_party_finance_law_desc:0 "Party money must be declared, audited, and made boring. Extremists hate it immediately, and the law's annual reporting requirements eliminate several traditional sources of mischief."

 GER_zem_courts_against_cults:0 "Courts Against Cults"
 GER_zem_courts_against_cults_desc:0 "Courts receive authority to dismantle coercive political cult structures while preserving normal political organisation. Judges, traditionally cautious, find the topic surprisingly congenial."

 GER_zem_reeducate_the_propagandists:0 "Reeducate the Propagandists"
 GER_zem_reeducate_the_propagandists_desc:0 "Former regime propagandists are reassigned to public-service messaging. Some complain that accuracy ruins their art; their new editors disagree with quiet finality."

 GER_zem_audit_the_rallies:0 "Audit the Rallies"
 GER_zem_audit_the_rallies_desc:0 "A dry financial audit of old mass rallies reveals absurd expenses, suspicious contracts, and entirely too much money spent on lighting. The published report is, briefly, the country's best-selling book."

 GER_zem_public_broadcasting_charter:0 "Public Broadcasting Charter"
 GER_zem_public_broadcasting_charter_desc:0 "Radio is reorganised under a charter requiring civic education, debate programming, and a legally protected right to mock bad speeches. Every household soon has an opinion on whether the Tuesday rebuttal hour is fair."

 GER_zem_the_new_civic_calendar:0 "The New Civic Calendar"
 GER_zem_the_new_civic_calendar_desc:0 "The founding tavern speech, the empty podium debate, and the referendum become civic dates in the new political mythology. They are observed with parades that contain no boots."

 GER_zem_economic_seriousness:0 "Economic Seriousness"
 GER_zem_economic_seriousness_desc:0 "Zemmour insists that a political movement which cannot manage prices should not manage history. Economic seriousness becomes a slogan, and ministers find their press conferences abruptly populated by men with calculators."

 GER_zem_workers_who_argue_back:0 "Workers Who Argue Back"
 GER_zem_workers_who_argue_back_desc:0 "Workers are invited into structured debate forums rather than abandoned to extremist recruitment. The meetings are loud but productive, and the resulting policy papers are surprisingly readable."

 GER_zem_small_business_reconquest:0 "Small Business Reconquest"
 GER_zem_small_business_reconquest_desc:0 "Shopkeepers and small manufacturers receive regulatory relief in exchange for joining the national stabilisation campaign. Their participation gives the movement a quieter, less spectacular base of support."

 GER_zem_housing_without_hysteria:0 "Housing Without Hysteria"
 GER_zem_housing_without_hysteria_desc:0 "Housing policy is presented without ideological screaming: bricks, rent rules, municipal planning, and fewer theatrical promises. The buildings are not impressive, but the families inside them are."

 GER_zem_culture_of_debate:0 "Culture of Debate"
 GER_zem_culture_of_debate_desc:0 "The government sponsors debates, essays, lecture halls, and competitions for the most devastating lawful rebuttal. The country develops a national habit of correcting itself in public."

 GER_zem_national_style_commission:0 "National Style Commission"
 GER_zem_national_style_commission_desc:0 "A commission studies why extremist aesthetics are so ugly and recommends cleaner typography, better suits, and fewer torches. The report is, against all expectation, charming."

 GER_zem_reconquete_social_contract:0 "RECONQUETE Social Contract"
 GER_zem_reconquete_social_contract_desc:0 "The government promises order, argument, work, family stability, and public dignity. In return, citizens are asked to stop applauding madmen, and the bargain seems to hold."

 GER_zem_the_second_tavern_speech:0 "The Second Tavern Speech"
 GER_zem_the_second_tavern_speech_desc:0 "Zemmour returns to the tavern where everything began. This time the speech is broadcast nationwide, and the joke has become a regime, and the regulars at the back of the room have learned to clap like cabinet ministers."

 GER_zem_reconquete_majority:0 "RECONQUETE Majority"
 GER_zem_reconquete_majority_desc:0 "The party wins or consolidates a national majority. Its opponents still sneer, but they do so from the opposition benches, where their sneering is recorded for the official transcript."

 GER_zem_end_the_hitler_question:0 "End the Hitler Question"
 GER_zem_end_the_hitler_question_desc:0 "Hitler is reduced from existential problem to legal nuisance, failed celebrity, and cautionary example in school debates. The country closes the file with a sense of administrative triumph."

 GER_zem_the_zemmourist_state:0 "The Zemmourist State"
 GER_zem_the_zemmourist_state_desc:0 "The state now speaks in the language of RECONQUETE: combative, bureaucratic, sarcastic, and determined never again to be ruled by theatrical hysteria. Every ministerial briefing closes with footnotes."

 GER_zem_europe_without_tantrums:0 "Europe Without Tantrums"
 GER_zem_europe_without_tantrums_desc:0 "Germany declares that European politics should be conducted through conferences, trade, and sharp speeches rather than reckless escalation. France is treated as a neighbour, not a target."

 GER_zem_the_final_rebuttal:0 "The Final Rebuttal"
 GER_zem_the_final_rebuttal_desc:0 "In a final national address, Zemmour frames the entire political transformation as one long rebuttal to Hitler. Germany is not quiet, but it is no longer hypnotised, and the broadcast becomes one of the most quoted speeches in modern European history."

 ##########################################
 # IDEAS — RECONQUETE expansion
 ##########################################

 GER_zem_reconquete_rising:0 "RECONQUETE Rising"
 GER_zem_reconquete_rising_desc:0 "The new movement grows from taverns, pamphlets, radio speeches, and the irresistible political power of making Hitler look ridiculous."

 GER_zem_barroom_network_idea:0 "Barroom Network"
 GER_zem_barroom_network_idea_desc:0 "Every tavern table seems to have become a cell of the new movement, and the regime can no longer tell drinking from organising."

 GER_zem_trained_street_orators:0 "Trained Street Orators"
 GER_zem_trained_street_orators_desc:0 "RECONQUETE speakers are trained to defeat hecklers, survive hostile crowds, and transform insults into applause."

 GER_zem_local_chapters_idea:0 "Local Chapters"
 GER_zem_local_chapters_idea_desc:0 "District-level chapters coordinate meetings, recruit members, and deliver pamphlets faster than the regime can ban them."

 GER_zem_public_order_without_thugs_idea:0 "Public Order Without Thugs"
 GER_zem_public_order_without_thugs_idea_desc:0 "The state is reclaiming public order from party militias and political street theatre."

 GER_zem_cabinet_of_reconquest:0 "Cabinet of RECONQUETE"
 GER_zem_cabinet_of_reconquest_desc:0 "The movement has become a government and must now survive the terrifying burden of competence."

 GER_zem_orator_ministers_idea:0 "Orator Ministers"
 GER_zem_orator_ministers_idea_desc:0 "Cabinet members are expected to defend their portfolios in public debate, and most of them prefer it that way."

 GER_zem_constitutional_guardrails_idea:0 "Constitutional Guardrails"
 GER_zem_constitutional_guardrails_idea_desc:0 "The new order limits itself in law so that no cult can simply replace the last."

 GER_zem_grand_compromise_idea:0 "The Grand Compromise"
 GER_zem_grand_compromise_idea_desc:0 "Conservatives, technocrats, and Zemmourists have signed an ugly but functional governing pact."

 GER_zem_public_broadcasting_charter_idea:0 "Public Broadcasting Charter"
 GER_zem_public_broadcasting_charter_idea_desc:0 "Radio has been converted from hysteria delivery system into a public arena for speeches, rebuttals, and civic education."

 GER_zem_zemmourist_state:0 "The Zemmourist State"
 GER_zem_zemmourist_state_desc:0 "Germany now operates under a Zemmourist political style: combative, legalistic, theatrical only when useful, and permanently allergic to Hitlerian melodrama."

 GER_zem_student_cells_idea:0 "Active Student Cells"
 GER_zem_student_cells_idea_desc:0 "University debate societies have become recruiting grounds for the movement."

 GER_zem_friendly_press_idea:0 "Friendly Press"
 GER_zem_friendly_press_idea_desc:0 "Sympathetic editors are publishing daily rebuttals of fascist hysteria."

 GER_zem_radio_hour_idea:0 "Radio Argument Hour"
 GER_zem_radio_hour_idea_desc:0 "Weekly RECONQUETE addresses are reaching factories, farms, and barracks."

 GER_zem_old_party_split_idea:0 "Old Party Splitting"
 GER_zem_old_party_split_idea_desc:0 "Moderates are quietly leaving the regime, and every defection is loudly announced."

 GER_zem_humiliated_propagandists:0 "Humiliated Propagandists"
 GER_zem_humiliated_propagandists_desc:0 "The old propaganda machine looks smaller after being mocked in public."

 GER_zem_moustache_pamphlet_idea:0 "Moustache Pamphlet"
 GER_zem_moustache_pamphlet_idea_desc:0 "A satirical pamphlet about facial hair has somehow become required reading in every workshop."

 GER_zem_isolate_loyalists_idea:0 "Isolated Loyalists"
 GER_zem_isolate_loyalists_idea_desc:0 "Hardline regime loyalists are being separated from opportunists and exposed to public scrutiny."

 GER_zem_ministry_of_argument_idea:0 "Ministry of Argument"
 GER_zem_ministry_of_argument_idea_desc:0 "Public rebuttal training has been made part of every ministry's standard practice."

 GER_zem_civil_service_reform_idea:0 "Civil Service Reform"
 GER_zem_civil_service_reform_idea_desc:0 "Civil servants are filing reports instead of staging rallies."

 GER_zem_industrial_pact_idea:0 "Industrial Pact"
 GER_zem_industrial_pact_idea_desc:0 "Industrialists have agreed to predictable politics in exchange for stable production rules."

 GER_zem_prussian_admin_idea:0 "Prussian Administrators"
 GER_zem_prussian_admin_idea_desc:0 "Veteran administrators have returned to government, and their file discipline is terrifying."

 GER_zem_campaign_trains_idea:0 "Campaign Trains"
 GER_zem_campaign_trains_idea_desc:0 "Trains carrying speakers and posters are turning the country into one rolling argument."

 GER_zem_republic_of_rebuttals_idea:0 "Republic of Rebuttals"
 GER_zem_republic_of_rebuttals_idea_desc:0 "Every minister is expected to defend policy in public; legitimacy is now measured in surviving rebuttal."

 GER_zem_trade_over_tantrums_idea:0 "Trade Over Tantrums"
 GER_zem_trade_over_tantrums_idea_desc:0 "Trade negotiations now take precedence over diplomatic theatrics."

 GER_zem_anti_communist_argument_idea:0 "Anti-Communist Argument"
 GER_zem_anti_communist_argument_idea_desc:0 "Anti-communism is being argued in print and in elections, not on battlefields."

 GER_zem_defensive_posture_idea:0 "Defensive Posture"
 GER_zem_defensive_posture_idea_desc:0 "Border policy is reframed as defence and customs administration."

 GER_zem_civic_discipline_idea:0 "Civic Discipline"
 GER_zem_civic_discipline_idea_desc:0 "Citizens are being asked to treat politics as civic duty rather than mass spectacle."

 GER_zem_courts_against_cults_idea:0 "Courts Against Cults"
 GER_zem_courts_against_cults_idea_desc:0 "Courts are dismantling coercive cult structures while leaving ordinary parties alone."

 GER_zem_economic_seriousness_idea:0 "Economic Seriousness"
 GER_zem_economic_seriousness_idea_desc:0 "Economic policy is being conducted by men with calculators rather than men with megaphones."

 GER_zem_workers_argue_back_idea:0 "Workers Who Argue Back"
 GER_zem_workers_argue_back_idea_desc:0 "Structured worker forums are absorbing energy that once leaked into extremist recruitment."

 GER_zem_small_business_idea:0 "Small Business Reconquest"
 GER_zem_small_business_idea_desc:0 "Shopkeepers and small manufacturers have joined the national stabilisation campaign."

 GER_zem_housing_idea:0 "Housing Without Hysteria"
 GER_zem_housing_idea_desc:0 "Municipal housing policy has resumed without ideological screaming."

 GER_zem_culture_of_debate_idea:0 "Culture of Debate"
 GER_zem_culture_of_debate_idea_desc:0 "Lecture halls and debate competitions have replaced rallies as the country's preferred political evening."

 ##########################################
