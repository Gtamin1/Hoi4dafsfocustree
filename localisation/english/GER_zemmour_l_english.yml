 ##########################################

 GER_zem_peaceful_neighbor:0 "Peaceful Neighbour Diplomacy"
 GER_zem_non_aggression:0 "RECONQUETE Non-Aggression"

 ##########################################
 # DECISION CATEGORIES
 ##########################################

 GER_zem_propaganda_category:0 "RECONQUETE Propaganda"
 GER_zem_propaganda_category_desc:0 "Mockery, broadcasts, debates, and other propaganda decisions of the RECONQUETE movement."

 GER_zem_organization_category:0 "RECONQUETE Organisation"
 GER_zem_organization_category_desc:0 "Local chapters, campaign trains, and conservative outreach for the RECONQUETE movement."

 ##########################################
 # DECISIONS
 ##########################################

 GER_zem_broadcast_reconquete_speech:0 "Broadcast a RECONQUETE Speech"
 GER_zem_broadcast_reconquete_speech_desc:0 "Air a polished Zemmour radio address. Costs political power, raises RECONQUETE support."

 GER_zem_print_meme_posters:0 "Print Meme Posters"
 GER_zem_print_meme_posters_desc:0 "Run another print run of mocking posters. Lowers fascist popularity at a small cost to public order."

 GER_zem_hold_public_debate:0 "Hold a Public Debate"
 GER_zem_hold_public_debate_desc:0 "Stage a major public debate. The result usually favours RECONQUETE, but a poor showing costs stability."

 GER_zem_audit_local_party_office:0 "Audit a Fascist Local Office"
 GER_zem_audit_local_party_office_desc:0 "Sic an auditor on a fascist local office. Lowers fascist popularity through scandal."

 GER_zem_radio_rebuttal:0 "Radio Rebuttal"
 GER_zem_radio_rebuttal_desc:0 "Run a 90-day rebuttal series on national radio that drives down fascist drift."

 GER_zem_open_local_chapter:0 "Open a Local Chapter"
 GER_zem_open_local_chapter_desc:0 "Found a new district chapter of RECONQUETE. Raises party popularity."

 GER_zem_secure_municipality:0 "Secure a Municipality"
 GER_zem_secure_municipality_desc:0 "Bring a town council into the RECONQUETE coalition. Stability and party popularity rise."

 GER_zem_campaign_train_stop:0 "Campaign Train Stop"
 GER_zem_campaign_train_stop_desc:0 "Run a campaign train stop in support of the referendum. Builds momentum for the plebiscite path."

 GER_zem_conservative_negotiation:0 "Negotiate with Conservatives"
 GER_zem_conservative_negotiation_desc:0 "Hold another quiet meeting with the conservative bloc. Builds momentum for the Grand Compromise."

 GER_zem_public_order_operation:0 "Public Order Operation"
 GER_zem_public_order_operation_desc:0 "Coordinated police and judicial action against extremist intimidation. No private armies, no theatrics."

 ##########################################
 # NEWS EVENTS — GER_zem_news.3 .. .9
 ##########################################

 GER_zem_news.3.t:0 "The Berlin Rally of RECONQUETE"
 GER_zem_news.3.d:0 "A vast rally in Berlin has confirmed that RECONQUETE is no longer a tavern movement. Supporters filled the streets to hear Eric Zemmour denounce hysterical politics and promise a disciplined national future. Foreign press describe scenes that resemble a campaign rather than a putsch, and several embassies have requested transcripts."
 GER_zem_news.3.a:0 "Remarkable."
 GER_zem_news.3.b:0 "Germany is changing."

 GER_zem_news.4.t:0 "A Vote of No Confidence Shakes Germany"
 GER_zem_news.4.d:0 "Germany's political crisis has entered formal procedure as RECONQUETE forces a vote of no confidence. The result is uncertain, but Hitler's aura of inevitability has been punctured, and the world's chancelleries are reading the same dispatches at the same hour."
 GER_zem_news.4.a:0 "Remarkable."
 GER_zem_news.4.b:0 "We watch with interest."

 GER_zem_news.5.t:0 "Zemmour Enters the Chancellery"
 GER_zem_news.5.d:0 "After weeks of crisis, coalition pressure, and public mobilisation, Eric Zemmour has entered the Chancellery. Observers describe the moment as both absurd and historic, and the new government has already announced that its first three policies will be argued in public before they are signed."
 GER_zem_news.5.a:0 "Remarkable."
 GER_zem_news.5.b:0 "An astonishing turn."

 GER_zem_news.6.t:0 "Germany Votes on RECONQUETE"
 GER_zem_news.6.d:0 "Germany has held a referendum on the future of the state and the role of RECONQUETE. Across Europe, governments watch closely as ballots are counted, and the result will decide whether the new movement governs by mandate or by negotiated coalition."
 GER_zem_news.6.a:0 "Remarkable."
 GER_zem_news.6.b:0 "We await the count."

 GER_zem_news.7.t:0 "Berlin Hosts a Conference of Calm"
 GER_zem_news.7.d:0 "The new German government has hosted a European conference stressing diplomacy, trade, and political confidence rather than military adventure. France attends as a partner, not a target, and the closing communique is unusually short and unusually friendly."
 GER_zem_news.7.a:0 "Remarkable."
 GER_zem_news.7.b:0 "A welcome change of tone."

 GER_zem_news.8.t:0 "The Second Tavern Speech"
 GER_zem_news.8.d:0 "Eric Zemmour has returned to the tavern where his movement began, delivering a national broadcast that frames RECONQUETE as the movement that turned mockery into government. The speech ends with a quiet promise that the country will never again be ruled by men shouting from balconies."
 GER_zem_news.8.a:0 "Remarkable."
 GER_zem_news.8.b:0 "A historic broadcast."

 GER_zem_news.9.t:0 "The Final Rebuttal"
 GER_zem_news.9.d:0 "In a final national address, Zemmour declared that Germany had answered the politics of hysteria with one long rebuttal. Foreign observers remain cautious, but the internal transformation is undeniable, and the era of theatrical melodrama in Berlin appears, at last, to be ending."
 GER_zem_news.9.a:0 "Remarkable."
 GER_zem_news.9.b:0 "Europe takes note."

 ##########################################
 # COUNTRY EVENTS — GER_zem_country.1 .. .18
 ##########################################

 GER_zem_country.1.t:0 "The Barroom Network Expands"
 GER_zem_country.1.d:0 "Reports from district organisers describe a sudden bloom of new tavern cells. Each one is small, each one is loud, and each one swears it founded the movement. Treasurers are torn between exasperation and pride, while local police forces have begun marking sympathetic taverns on internal maps."
 GER_zem_country.1.a:0 "Channel the energy into proper organisation."
 GER_zem_country.1.b:0 "Calm them down before the regime notices."

 GER_zem_country.2.t:0 "Student Cells Demand Recognition"
 GER_zem_country.2.d:0 "Student leaders insist on a formal seat at the next national congress. They have prepared three printed manifestos, two debate motions, and one extremely loud chant. The party leadership must decide whether to embrace the disorder or politely contain it."
 GER_zem_country.2.a:0 "Welcome them in."
 GER_zem_country.2.b:0 "Defer the question to a committee."

 GER_zem_country.3.t:0 "The Empty Podium Goes Viral"
 GER_zem_country.3.d:0 "Photographs of an empty fascist podium beside a full RECONQUETE one have been reproduced across the country. Children draw it in chalk, newspapers reprint it without commentary, and one provincial mayor allegedly hung it in his office."
 GER_zem_country.3.a:0 "Encourage the spread."
 GER_zem_country.3.b:0 "Move the moment forward, do not dwell on it."

 GER_zem_country.4.t:0 "A Conservative Delegation Arrives"
 GER_zem_country.4.d:0 "A delegation of grey-suited conservatives has requested an audience. They dislike Hitler's chaos, distrust RECONQUETE's youth, and would very much like a guarantee of stability. They have brought tea, lawyers, and a list of conditions."
 GER_zem_country.4.a:0 "Offer firm guarantees."
 GER_zem_country.4.b:0 "Promise nothing in writing."

 GER_zem_country.5.t:0 "Industrialists Ask for Stability"
 GER_zem_country.5.d:0 "A group of leading industrialists request a private meeting. Their factories are tired of street politics. They ask only that revolutions be conducted on a predictable schedule and ideally not during shift changes."
 GER_zem_country.5.a:0 "Promise predictability."
 GER_zem_country.5.b:0 "Welcome their funding without binding promises."

 GER_zem_country.6.t:0 "Army Officers Request Guarantees"
 GER_zem_country.6.d:0 "Senior officers want assurances that the new movement will not turn the army into a propaganda squad. They are willing to listen, provided the conversation includes budgets, postings, and a polite end to amateur military rhetoric."
 GER_zem_country.6.a:0 "Reassure them at length."
 GER_zem_country.6.b:0 "Offer political concessions instead."

 GER_zem_country.7.t:0 "The Referendum Campaign Begins"
 GER_zem_country.7.d:0 "Posters, trains, microphones, and pamphlets are deployed across the country. The campaign theme is simple: ballots over brawlers. Local organisers are exhausted within a week and energised within two."
 GER_zem_country.7.a:0 "Press the campaign at full intensity."

 GER_zem_country.8.t:0 "Referendum Night"
 GER_zem_country.8.d:0 "The ballots are counted under the careful eyes of clerks, observers, and a great many cigarettes. A nation waits while microphones hum gently in the background. The result will define the rest of the political tree, and possibly the rest of the decade."
 GER_zem_country.8.a:0 "RECONQUETE has won a clear mandate."
 GER_zem_country.8.b:0 "RECONQUETE has won enough for a coalition."
 GER_zem_country.8.c:0 "The result is too close; we must regroup."

 GER_zem_country.9.t:0 "A Failed Fascist Counter-Rally"
 GER_zem_country.9.d:0 "An attempted fascist counter-rally has fizzled into hecklers, rain, and one unscheduled debate. The footage circulates faster than the rally itself ever could, and the regime's organisers are reportedly furious with one another."
 GER_zem_country.9.a:0 "Let the footage speak for itself."

 GER_zem_country.10.t:0 "The Second Tavern Speech Preparations"
 GER_zem_country.10.d:0 "The original tavern is being rebooked for a national broadcast. Microphones are tested, loyal regulars are seated in carefully spontaneous positions, and the speech itself is rehearsed twice while pretending to be improvised."
 GER_zem_country.10.a:0 "Make it as polished as possible."
 GER_zem_country.10.b:0 "Keep it raw and rough on purpose."

 GER_zem_country.11.t:0 "The Moustache Pamphlet Scandal"
 GER_zem_country.11.d:0 "A satirical pamphlet about facial hair has provoked an absurd scandal. Officials demand it be banned. Banning it triples its circulation. Ministers receive private copies marked, with great formality, as evidence."
 GER_zem_country.11.a:0 "Defend the right to mock."
 GER_zem_country.11.b:0 "Distance the party from the joke."

 GER_zem_country.12.t:0 "The Audit of the Rallies"
 GER_zem_country.12.d:0 "Auditors reviewing old rally invoices have discovered absurd expenses, suspicious contracts, and entirely too much money spent on stage lighting. Several names are quietly noted in margins, and the published summary becomes the country's most-discussed financial document of the year."
 GER_zem_country.12.a:0 "Publish the full report."

 GER_zem_country.13.t:0 "Local Elections Return"
 GER_zem_country.13.d:0 "The first round of restored municipal elections has begun. Booths are calm, observers are bored, and the regime's old organisers are visibly out of practice. RECONQUETE candidates are everywhere, and so are the leaflets explaining what a ballot does."
 GER_zem_country.13.a:0 "Press for clean turnout."
 GER_zem_country.13.b:0 "Use the moment for a stability campaign."

 GER_zem_country.14.t:0 "The Monarchist Conversation"
 GER_zem_country.14.d:0 "A small conservative faction has proposed a symbolic monarchy. They are perfectly polite, perfectly serious, and perfectly aware that the answer is most likely no. They request only that the conversation be permitted to occur in public."
 GER_zem_country.14.a:0 "Permit the conversation, refuse the substance."
 GER_zem_country.14.b:0 "Keep them inside the coalition with vague gestures."

 GER_zem_country.15.t:0 "The Legal End of the Cult"
 GER_zem_country.15.d:0 "Courts have begun the slow, methodical work of dismantling the institutional privileges of the old cult. There is no fanfare, no executions, and no theatrical revenge — only paperwork, hearings, and the steady extinguishing of an aura. It is, somehow, more devastating than any purge."
 GER_zem_country.15.a:0 "Let the law do its quiet work."

 GER_zem_country.16.t:0 "Foreign Diplomats Ask About France"
 GER_zem_country.16.d:0 "Several foreign embassies have asked, with diplomatic delicacy, what the new German government intends regarding France. The answer is short and unusual for Berlin in this decade: France is a neighbour, not a target, and any hint of the contrary would be loudly contradicted by Zemmour himself."
 GER_zem_country.16.a:0 "Issue a public guarantee of peaceful relations."
 GER_zem_country.16.b:0 "Acknowledge the question without elaborating."

 GER_zem_country.17.t:0 "Radio to the World"
 GER_zem_country.17.d:0 "International broadcasts present the new political turn to foreign capitals. Cautious analyses run on the BBC, polite editorials appear in Le Temps, and an unusually friendly note arrives from Stockholm. The international system has noticed that Berlin has stopped shouting."
 GER_zem_country.17.a:0 "Continue the broadcasts at full strength."

 GER_zem_country.18.t:0 "The Final Rebuttal"
 GER_zem_country.18.d:0 "All preparations are complete. The microphones are ready, the speech is finished, and dawn approaches over Berlin. Zemmour will address the country one last time before the broadcast becomes history. Whatever else the regime did, it was forced to listen."
 GER_zem_country.18.a:0 "Deliver the final rebuttal."

